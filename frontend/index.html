<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LexAgent — Contract Intelligence</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:          #F7F6F2;
      --surface:     #FFFFFF;
      --surface-2:   #F0EEE8;
      --surface-3:   #E8E5DC;
      --border:      #D4D0C4;
      --border-dark: #B8B4A4;
      --text-pri:    #1A1915;
      --text-sec:    #4A4840;
      --text-ter:    #7A7868;
      --text-inv:    #FFFFFF;
      --ink:         #1A1915;
      --rule:        #C8C4B4;

      /* Semantic */
      --critical:    #B91C1C;
      --critical-bg: #FEF2F2;
      --critical-br: #FECACA;
      --high:        #C2410C;
      --high-bg:     #FFF7ED;
      --high-br:     #FED7AA;
      --medium:      #A16207;
      --medium-bg:   #FEFCE8;
      --medium-br:   #FDE68A;
      --low:         #166534;
      --low-bg:      #F0FDF4;
      --low-br:      #BBF7D0;
      --none:        #374151;
      --none-bg:     #F9FAFB;
      --none-br:     #E5E7EB;
      --info:        #1D4ED8;
      --info-bg:     #EFF6FF;
      --info-br:     #BFDBFE;

      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
      --serif: 'IBM Plex Serif', serif;
      --radius: 2px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text-pri);
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-dark); }

    /* ── Typography ── */
    .mono { font-family: var(--mono); }
    .serif { font-family: var(--serif); }
    .label-xs {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-ter);
    }

    /* ── Header ── */
    .site-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-wordmark {
      display: flex;
      align-items: baseline;
      gap: 10px;
      border-right: 1px solid var(--border);
      padding-right: 20px;
      margin-right: 20px;
    }

    .wordmark-primary {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--ink);
    }

    .wordmark-divider {
      width: 1px;
      height: 12px;
      background: var(--border-dark);
    }

    .wordmark-secondary {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 300;
      color: var(--text-ter);
      letter-spacing: 0.03em;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .header-nav-item {
      font-size: 12px;
      color: var(--text-ter);
      font-family: var(--mono);
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: color 0.15s;
      text-decoration: none;
    }

    .header-nav-item:hover { color: var(--ink); }
    .header-nav-item.active { color: var(--ink); font-weight: 500; }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-cluster {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--text-ter);
      padding: 3px 8px;
      border: 1px solid var(--border);
      background: var(--bg);
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }

    /* ── Main Layout ── */
    .main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 40px 40px 80px;
    }

    /* ── Page Title ── */
    .page-head {
      border-bottom: 1px solid var(--rule);
      padding-bottom: 20px;
      margin-bottom: 32px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .page-title {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 400;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .page-subtitle {
      font-size: 12px;
      color: var(--text-ter);
      margin-top: 4px;
      font-family: var(--sans);
      font-weight: 300;
    }

    .page-doc-ref {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-ter);
      letter-spacing: 0.06em;
    }

    /* ── Section Headers (formal document style) ── */
    .section-rule {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      margin-top: 32px;
    }

    .section-number {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--text-ter);
      letter-spacing: 0.1em;
      flex-shrink: 0;
    }

    .section-title-text {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-sec);
      flex-shrink: 0;
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: var(--rule);
    }

    .section-count {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-ter);
      flex-shrink: 0;
    }

    /* ── Upload / Intake Panel ── */
    .intake-grid {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      margin-bottom: 32px;
    }

    .intake-main {
      background: var(--surface);
      padding: 32px;
    }

    .intake-sidebar {
      background: var(--surface-2);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .drop-zone {
      border: 1px dashed var(--border-dark);
      background: var(--bg);
      padding: 36px 24px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: background 0.15s, border-color 0.15s;
    }

    .drop-zone:hover, .drop-zone.drag-over {
      background: var(--surface-2);
      border-color: var(--ink);
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-icon-wrap {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border-dark);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }

    .drop-icon-wrap svg {
      width: 18px;
      height: 18px;
      stroke: var(--text-sec);
      fill: none;
      stroke-width: 1.5;
    }

    .drop-primary {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-pri);
      margin-bottom: 4px;
    }

    .drop-secondary {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-ter);
      letter-spacing: 0.06em;
    }

    .file-selected {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      background: var(--info-bg);
      padding: 10px 14px;
      margin-top: 12px;
    }

    .file-selected svg {
      width: 16px;
      height: 16px;
      stroke: var(--info);
      fill: none;
      stroke-width: 1.5;
      flex-shrink: 0;
    }

    .file-name {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--info);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-size {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-ter);
    }

    /* ── Settings in Sidebar ── */
    .setting-group { display: flex; flex-direction: column; gap: 10px; }

    .setting-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-ter);
      margin-bottom: 4px;
    }

    .setting-select {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-pri);
      appearance: none;
      cursor: pointer;
      outline: none;
    }

    .setting-select:focus { border-color: var(--ink); }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-label {
      font-size: 12px;
      color: var(--text-sec);
      font-family: var(--sans);
    }

    .toggle {
      position: relative;
      width: 28px;
      height: 15px;
      flex-shrink: 0;
    }

    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--border-dark);
      cursor: pointer;
      transition: background 0.15s;
    }

    .toggle input:checked + .toggle-track { background: var(--ink); }

    .toggle-track::after {
      content: '';
      position: absolute;
      width: 11px;
      height: 11px;
      left: 2px;
      top: 2px;
      background: white;
      transition: transform 0.15s;
    }

    .toggle input:checked + .toggle-track::after { transform: translateX(13px); }

    /* ── Button ── */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      background: var(--ink);
      color: var(--text-inv);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid var(--ink);
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 16px;
    }

    .btn-primary:hover:not(:disabled) { background: #2d2c26; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--surface);
      color: var(--text-sec);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-secondary:hover { border-color: var(--border-dark); color: var(--text-pri); }

    /* ── Status Bar ── */
    .status-bar {
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      font-family: var(--mono);
      font-size: 11px;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 1.5px solid var(--border);
      border-top-color: var(--ink);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Progress Steps ── */
    .progress-steps {
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 24px;
      border: 1px solid var(--border);
      background: var(--surface);
      overflow: hidden;
    }

    .progress-step {
      flex: 1;
      padding: 10px 12px;
      border-right: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .progress-step:last-child { border-right: none; }

    .step-num {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-ter);
      width: 16px;
      height: 16px;
      border: 1px solid var(--border-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step-num.active {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }

    .step-num.done {
      background: var(--low);
      color: white;
      border-color: var(--low);
    }

    .step-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-ter);
      letter-spacing: 0.06em;
    }

    .step-label.active { color: var(--ink); font-weight: 500; }

    /* ── Dashboard Grid ── */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      margin-bottom: 1px;
    }

    .kpi-cell {
      background: var(--surface);
      padding: 16px 20px;
    }

    .kpi-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-ter);
      margin-bottom: 8px;
    }

    .kpi-value {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1;
    }

    .kpi-sub {
      font-size: 11px;
      color: var(--text-ter);
      margin-top: 4px;
    }

    /* ── Risk Score Display ── */
    .risk-score-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 32px;
      margin-bottom: 1px;
    }

    .score-number-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      flex-shrink: 0;
    }

    .score-number {
      font-family: var(--mono);
      font-size: 56px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .score-denom {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text-ter);
      margin-top: 4px;
    }

    .score-bar-wrap { flex: 1; }

    .score-bar-track {
      height: 6px;
      background: var(--surface-3);
      position: relative;
      margin-bottom: 6px;
    }

    .score-bar-segments {
      position: absolute;
      inset: 0;
      display: flex;
    }

    .score-bar-seg {
      height: 100%;
    }

    .score-bar-fill {
      position: absolute;
      top: -3px;
      width: 2px;
      height: 12px;
      background: var(--ink);
      transition: left 0.5s ease;
    }

    .score-bar-labels {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text-ter);
      letter-spacing: 0.06em;
    }

    .score-verdict {
      font-family: var(--serif);
      font-size: 14px;
      color: var(--text-sec);
      margin-top: 12px;
      font-weight: 300;
      font-style: italic;
    }

    /* ── Distribution Table ── */
    .dist-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: none;
      overflow: hidden;
      margin-bottom: 32px;
    }

    .dist-table {
      width: 100%;
      border-collapse: collapse;
    }

    .dist-table th {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-ter);
      font-weight: 500;
      text-align: left;
      padding: 10px 16px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }

    .dist-table td {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 12px;
    }

    .dist-table tr:last-child td { border-bottom: none; }

    .dist-bar-cell { width: 40%; }

    .dist-bar-track {
      height: 4px;
      background: var(--surface-3);
    }

    .dist-bar-fill {
      height: 100%;
      transition: width 0.4s ease;
    }

    /* ── Risk Badge ── */
    .risk-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      padding: 2px 7px;
      border: 1px solid;
    }

    .risk-tag.CRITICAL { color: var(--critical); background: var(--critical-bg); border-color: var(--critical-br); }
    .risk-tag.HIGH     { color: var(--high);     background: var(--high-bg);     border-color: var(--high-br); }
    .risk-tag.MEDIUM   { color: var(--medium);   background: var(--medium-bg);   border-color: var(--medium-br); }
    .risk-tag.LOW      { color: var(--low);      background: var(--low-bg);      border-color: var(--low-br); }
    .risk-tag.NONE     { color: var(--none);     background: var(--none-bg);     border-color: var(--none-br); }

    /* ── Clause Cards ── */
    .clause-table {
      border: 1px solid var(--border);
      background: var(--surface);
      margin-bottom: 32px;
    }

    .clause-row {
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      transition: background 0.1s;
    }

    .clause-row:last-child { border-bottom: none; }
    .clause-row:hover { background: var(--surface-2); }

    .clause-row-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .clause-id {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-ter);
      letter-spacing: 0.06em;
    }

    .clause-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--info);
      background: var(--info-bg);
      border: 1px solid var(--info-br);
      padding: 1px 7px;
    }

    .clause-conf {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-ter);
      margin-left: auto;
    }

    .clause-reason {
      font-size: 13px;
      color: var(--text-pri);
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .clause-negotiate {
      border-left: 2px solid var(--border-dark);
      padding: 6px 12px;
      font-size: 12px;
      color: var(--text-sec);
      font-style: italic;
      font-family: var(--serif);
      background: var(--surface-2);
      margin-top: 6px;
    }

    .clause-negotiate strong {
      font-style: normal;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--text-ter);
      font-weight: 500;
    }

    /* ── Contradictions ── */
    .contra-table {
      border: 1px solid var(--border);
      background: var(--surface);
      margin-bottom: 32px;
    }

    .contra-row {
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }

    .contra-row:last-child { border-bottom: none; }

    .contra-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .contra-type {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-pri);
    }

    .contra-desc {
      font-size: 12px;
      color: var(--text-sec);
      margin-bottom: 10px;
    }

    .contra-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .contra-clause-block {
      background: var(--surface-2);
      padding: 10px 14px;
    }

    .contra-clause-ref {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-ter);
      letter-spacing: 0.06em;
      margin-bottom: 5px;
    }

    .contra-clause-text {
      font-size: 11px;
      color: var(--text-sec);
      line-height: 1.6;
    }

    /* ── Missing Clauses ── */
    .missing-table {
      border: 1px solid var(--border);
      background: var(--surface);
      margin-bottom: 32px;
    }

    .missing-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-sec);
    }

    .missing-row:last-child { border-bottom: none; }

    .missing-index {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-ter);
      flex-shrink: 0;
      margin-top: 2px;
      letter-spacing: 0.06em;
    }

    /* ── Summary ── */
    .summary-block {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 28px 32px;
      margin-bottom: 32px;
    }

    .summary-text {
      font-family: var(--serif);
      font-size: 14px;
      font-weight: 300;
      line-height: 1.9;
      color: var(--text-pri);
      white-space: pre-wrap;
    }

    /* ── Tabs ── */
    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom: none;
    }

    .tab {
      padding: 10px 20px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-ter);
      cursor: pointer;
      border-right: 1px solid var(--border);
      border-bottom: 2px solid transparent;
      transition: all 0.1s;
    }

    .tab:hover { color: var(--text-pri); }
    .tab.active { color: var(--ink); border-bottom-color: var(--ink); background: var(--bg); }

    /* ── Footer ── */
    .report-footer {
      border-top: 1px solid var(--rule);
      padding-top: 20px;
      margin-top: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-meta {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-ter);
      letter-spacing: 0.06em;
    }

    .footer-actions {
      display: flex;
      gap: 8px;
    }

    /* ── Empty ── */
    .empty-row {
      padding: 24px 20px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-ter);
      letter-spacing: 0.04em;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
    }

    .empty-check {
      width: 14px;
      height: 14px;
      border: 1px solid var(--low);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--low);
      font-size: 9px;
    }

    /* ── Responsive ── */
    @media (max-width: 860px) {
      .intake-grid { grid-template-columns: 1fr; }
      .kpi-row { grid-template-columns: repeat(3, 1fr); }
      .contra-pair { grid-template-columns: 1fr; }
      .main { padding: 20px; }
      .site-header { padding: 0 20px; }
      .score-number { font-size: 40px; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const API_BASE = 'https://lexagent-api.onrender.com';

const RISK_ORDER = ['CRITICAL','HIGH','MEDIUM','LOW','NONE'];
const RISK_COLORS = {
  CRITICAL: '#B91C1C', HIGH: '#C2410C', MEDIUM: '#A16207', LOW: '#166534', NONE: '#374151'
};
const RISK_BAR_COLORS = {
  CRITICAL: '#FCA5A5', HIGH: '#FDBA74', MEDIUM: '#FDE68A', LOW: '#BBF7D0', NONE: '#E5E7EB'
};

const AGENTS = ['Extraction','Segmentation','Classification','Risk Scoring','Contradiction Detection','Summarization'];

function RiskTag({ level }) {
  return <span className={`risk-tag ${level}`}>{level}</span>;
}

function SectionHeader({ num, title, count }) {
  return (
    <div className="section-rule">
      <span className="section-number">{num}</span>
      <span className="section-title-text">{title}</span>
      <div className="section-line" />
      {count !== undefined && <span className="section-count">{count} item{count !== 1 ? 's' : ''}</span>}
    </div>
  );
}

function HealthIndicator({ health }) {
  if (!health) return null;
  const items = [['OLLAMA', health.ollama], ['CHROMADB', health.chromadb], ['GPU', health.gpu]];
  return (
    <div className="status-cluster">
      {items.map(([label, ok]) => (
        <div key={label} className="status-pill">
          <span className="status-dot" style={{ background: ok ? '#166534' : '#B91C1C' }} />
          {label}
        </div>
      ))}
    </div>
  );
}

function ScoreBar({ score }) {
  const pct = Math.max(0, Math.min(1, score)) * 100;
  const color = pct >= 75 ? '#B91C1C' : pct >= 50 ? '#C2410C' : pct >= 25 ? '#A16207' : '#166534';
  const verdict = pct >= 75
    ? 'This contract presents substantial legal exposure. Independent counsel is strongly advised prior to execution.'
    : pct >= 50
    ? 'Moderate risk detected. Key clauses require negotiation before execution.'
    : pct >= 25
    ? 'Low to moderate risk. Review flagged items and confirm standard protections are present.'
    : 'Risk profile is within acceptable parameters. Standard review recommended.';
  return (
    <div className="score-bar-wrap">
      <div className="score-bar-track">
        <div className="score-bar-segments">
          {[['#BBF7D0',25],['#FDE68A',25],['#FDBA74',25],['#FCA5A5',25]].map(([c,w],i) => (
            <div key={i} className="score-bar-seg" style={{ width: `${w}%`, background: c }} />
          ))}
        </div>
        <div className="score-bar-fill" style={{ left: `calc(${pct}% - 1px)` }} />
      </div>
      <div className="score-bar-labels">
        <span>LOW RISK</span>
        <span>MEDIUM</span>
        <span>HIGH</span>
        <span>CRITICAL</span>
      </div>
      <div className="score-verdict" style={{ color }}>{verdict}</div>
    </div>
  );
}

function ProcessingSteps({ activeIdx }) {
  return (
    <div className="progress-steps">
      {AGENTS.map((a, i) => (
        <div key={a} className="progress-step">
          <div className={`step-num ${i < activeIdx ? 'done' : i === activeIdx ? 'active' : ''}`}>
            {i < activeIdx ? '✓' : i + 1}
          </div>
          <span className={`step-label ${i === activeIdx ? 'active' : ''}`}>{a}</span>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [file, setFile]           = useState(null);
  const [dragging, setDragging]   = useState(false);
  const [jobId, setJobId]         = useState(null);
  const [status, setStatus]       = useState('idle');
  const [report, setReport]       = useState(null);
  const [errorMsg, setErrorMsg]   = useState('');
  const [health, setHealth]       = useState(null);
  const [activeStep, setActiveStep] = useState(0);
  const [activeTab, setActiveTab] = useState('risk');
  const [settings, setSettings]   = useState({ jurisdiction: 'IN', mode: 'standard', comparative: true, negotiate: true });
  const pollRef = useRef(null);
  const stepRef = useRef(null);

  useEffect(() => {
    fetch(`${API_BASE}/health`).then(r => r.json()).then(setHealth).catch(() => {});
  }, []);

  useEffect(() => {
    if (status === 'processing') {
      setActiveStep(0);
      stepRef.current = setInterval(() => {
        setActiveStep(s => s < AGENTS.length - 1 ? s + 1 : s);
      }, 12000);
    } else {
      clearInterval(stepRef.current);
    }
    return () => clearInterval(stepRef.current);
  }, [status]);

  useEffect(() => {
    if (status === 'processing' && jobId) {
      pollRef.current = setInterval(async () => {
        try {
          const res = await fetch(`${API_BASE}/status/${jobId}`);
          const data = await res.json();
          if (data.status === 'complete') {
            clearInterval(pollRef.current);
            setActiveStep(AGENTS.length);
            setStatus('complete');
            setReport(data.result);
          } else if (data.status === 'error') {
            clearInterval(pollRef.current);
            setStatus('error');
            setErrorMsg(data.error || 'Analysis failed.');
          }
        } catch {
          clearInterval(pollRef.current);
          setStatus('error');
          setErrorMsg('Lost connection to analysis server.');
        }
      }, 2000);
    }
    return () => clearInterval(pollRef.current);
  }, [status, jobId]);

  const handleFile = (f) => { if (f) setFile(f); };
  const handleDrop = (e) => { e.preventDefault(); setDragging(false); handleFile(e.dataTransfer.files?.[0]); };

  const handleAnalyze = async () => {
    if (!file) return;
    setStatus('processing'); setReport(null); setErrorMsg('');
    const form = new FormData();
    form.append('file', file);
    try {
      const res = await fetch(`${API_BASE}/analyze`, { method: 'POST', body: form });
      if (!res.ok) { const e = await res.json(); throw new Error(e.detail || 'Upload failed.'); }
      const data = await res.json();
      setJobId(data.job_id);
    } catch (e) { setStatus('error'); setErrorMsg(e.message); }
  };

  const handleExportJSON = () => {
    if (!report) return;
    const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = `lexagent_report_${report.contract_id?.slice(0,8) || 'export'}.json`; a.click();
    URL.revokeObjectURL(url);
  };

  const handleExportCSV = () => {
    if (!report?.critical_clauses?.length) return;
    const rows = [['Clause ID','Risk Level','Label','Confidence','Reason'].join(',')];
    report.critical_clauses.forEach(c => {
      rows.push([c.clause_id, c.risk_level, c.label, c.label_score?.toFixed(2) || '', `"${(c.risk_reason || '').replace(/"/g,'""')}"`].join(','));
    });
    const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = `lexagent_clauses_${report.contract_id?.slice(0,8) || 'export'}.csv`; a.click();
    URL.revokeObjectURL(url);
  };

  const maxCount = report ? Math.max(...Object.values(report.risk_distribution || {}), 1) : 1;
  const score = report?.overall_risk_score || 0;
  const scorePct = Math.round(score * 100);

  const tabs = [
    { id: 'risk',    label: 'Risk Clauses',    count: report?.critical_clauses?.length },
    { id: 'contra',  label: 'Contradictions',  count: report?.contradictions?.length },
    { id: 'missing', label: 'Missing Clauses', count: report?.missing_clauses?.length },
    { id: 'summary', label: 'Summary',         count: null },
  ];

  return (
    <div>
      {/* Header */}
      <header className="site-header">
        <div className="header-wordmark">
          <span className="wordmark-primary">LEXAGENT</span>
          <div className="wordmark-divider" />
          <span className="wordmark-secondary">Contract Intelligence Platform</span>
        </div>
        <nav className="header-nav">
          <span className="header-nav-item active">Analysis</span>
          <span className="header-nav-item">History</span>
          <span className="header-nav-item">Clauses</span>
          <span className="header-nav-item">Settings</span>
        </nav>
        <div className="header-right">
          <HealthIndicator health={health} />
        </div>
      </header>

      <div className="main">

        {/* Page Head */}
        <div className="page-head">
          <div>
            <div className="page-title">Contract Analysis</div>
            <div className="page-subtitle">Upload a contract document to generate a structured risk assessment report.</div>
          </div>
          <span className="page-doc-ref">REF: LEX-ANALYSIS-001</span>
        </div>

        {/* Section 1 — Document Intake */}
        <SectionHeader num="§ 1" title="Document Intake" />

        <div className="intake-grid">
          <div className="intake-main">
            <div
              className={`drop-zone ${dragging ? 'drag-over' : ''}`}
              onDragOver={e => { e.preventDefault(); setDragging(true); }}
              onDragLeave={() => setDragging(false)}
              onDrop={handleDrop}
            >
              <input type="file" accept=".pdf,.docx,.doc" onChange={e => handleFile(e.target.files?.[0])} />
              <div className="drop-icon-wrap">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              </div>
              <div className="drop-primary">Upload contract document</div>
              <div className="drop-secondary">PDF · DOCX · Maximum 20 MB</div>
            </div>

            {file && (
              <div className="file-selected">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span className="file-name">{file.name}</span>
                <span className="file-size">{(file.size / 1024).toFixed(1)} KB</span>
              </div>
            )}

            <button
              className="btn-primary"
              onClick={handleAnalyze}
              disabled={!file || status === 'processing'}
            >
              {status === 'processing' ? '↻  Processing...' : '→  Run Analysis'}
            </button>
          </div>

          <div className="intake-sidebar">
            <div className="setting-group">
              <div className="setting-label">Jurisdiction</div>
              <select className="setting-select" value={settings.jurisdiction}
                onChange={e => setSettings(s => ({ ...s, jurisdiction: e.target.value }))}>
                <option value="IN">India (IN)</option>
                <option value="US">United States (US)</option>
                <option value="UK">United Kingdom (UK)</option>
                <option value="SG">Singapore (SG)</option>
              </select>
            </div>

            <div className="setting-group">
              <div className="setting-label">Analysis Mode</div>
              <select className="setting-select" value={settings.mode}
                onChange={e => setSettings(s => ({ ...s, mode: e.target.value }))}>
                <option value="standard">Standard</option>
                <option value="deep">Deep (2× tokens)</option>
                <option value="quick">Quick Scan</option>
              </select>
            </div>

            <div className="setting-group">
              <div className="setting-label">Options</div>
              {[
                ['comparative', 'Comparative Scoring'],
                ['negotiate', 'Negotiation Points'],
              ].map(([key, label]) => (
                <div key={key} className="toggle-row">
                  <span className="toggle-label">{label}</span>
                  <label className="toggle">
                    <input type="checkbox" checked={settings[key]}
                      onChange={() => setSettings(s => ({ ...s, [key]: !s[key] }))} />
                    <span className="toggle-track" />
                  </label>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* Processing */}
        {status === 'processing' && (<>
          <ProcessingSteps activeIdx={activeStep} />
          <div className="status-bar">
            <div className="spinner" />
            <span style={{ color: 'var(--text-sec)' }}>
              AGENT {activeStep + 1}/{AGENTS.length} — {AGENTS[Math.min(activeStep, AGENTS.length - 1)].toUpperCase()} · First run may take 60–120 seconds while models load.
            </span>
          </div>
        </>)}

        {status === 'error' && (
          <div className="status-bar" style={{ borderColor: 'var(--critical-br)', background: 'var(--critical-bg)' }}>
            <span style={{ color: 'var(--critical)', fontFamily: 'var(--mono)', fontSize: 11 }}>ERROR — {errorMsg}</span>
          </div>
        )}

        {/* ── Report ── */}
        {status === 'complete' && report && (<>

          {/* Section 2 — Executive Summary */}
          <SectionHeader num="§ 2" title="Executive Risk Assessment" />

          <div className="risk-score-panel">
            <div className="score-number-wrap">
              <div className="score-number" style={{
                color: scorePct >= 75 ? 'var(--critical)' : scorePct >= 50 ? 'var(--high)' : scorePct >= 25 ? 'var(--medium)' : 'var(--low)'
              }}>{scorePct}</div>
              <div className="score-denom">/ 100 RISK INDEX</div>
            </div>
            <ScoreBar score={score} />
          </div>

          <div className="kpi-row">
            {[
              ['Document Type', report.document_type, ''],
              ['Total Pages', report.pages, ''],
              ['Clauses Extracted', report.total_clauses, ''],
              ['Critical / High', (report.risk_distribution?.CRITICAL || 0) + ' / ' + (report.risk_distribution?.HIGH || 0), ''],
              ['Extraction Method', report.extraction_method, ''],
            ].map(([label, val]) => (
              <div key={label} className="kpi-cell">
                <div className="kpi-label">{label}</div>
                <div className="kpi-value" style={{ fontSize: String(val).length > 8 ? 14 : 22 }}>{val}</div>
              </div>
            ))}
          </div>

          <div className="dist-panel">
            <table className="dist-table">
              <thead>
                <tr>
                  <th>Risk Level</th>
                  <th>Count</th>
                  <th className="dist-bar-cell">Distribution</th>
                  <th>% of Total</th>
                </tr>
              </thead>
              <tbody>
                {RISK_ORDER.map(level => {
                  const count = report.risk_distribution?.[level] || 0;
                  const pct = report.total_clauses ? ((count / report.total_clauses) * 100).toFixed(1) : '0.0';
                  return (
                    <tr key={level}>
                      <td><RiskTag level={level} /></td>
                      <td style={{ color: RISK_COLORS[level], fontWeight: 600 }}>{count}</td>
                      <td>
                        <div className="dist-bar-track">
                          <div className="dist-bar-fill" style={{
                            width: `${(count / maxCount) * 100}%`,
                            background: RISK_BAR_COLORS[level]
                          }} />
                        </div>
                      </td>
                      <td style={{ color: 'var(--text-ter)' }}>{pct}%</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          {/* Section 3 — Findings */}
          <SectionHeader num="§ 3" title="Detailed Findings" />

          <div className="tab-bar">
            {tabs.map(t => (
              <div key={t.id} className={`tab ${activeTab === t.id ? 'active' : ''}`}
                onClick={() => setActiveTab(t.id)}>
                {t.label}{t.count !== null && t.count !== undefined ? ` (${t.count})` : ''}
              </div>
            ))}
          </div>

          {/* Tab: Risk Clauses */}
          {activeTab === 'risk' && (
            (!report.critical_clauses?.length)
              ? <div className="empty-row"><div className="empty-check">✓</div>No critical or high-risk clauses identified.</div>
              : <div className="clause-table">
                  {report.critical_clauses.map((c, i) => (
                    <div key={i} className="clause-row">
                      <div className="clause-row-header">
                        <span className="clause-id">{c.clause_id}</span>
                        <RiskTag level={c.risk_level} />
                        <span className="clause-label">{c.label}</span>
                        {c.label_score != null && (
                          <span className="clause-conf">CONF {(c.label_score * 100).toFixed(0)}%</span>
                        )}
                      </div>
                      <div className="clause-reason">{c.risk_reason}</div>
                      {c.negotiation_point && (
                        <div className="clause-negotiate">
                          <strong>RECOMMENDED ACTION — </strong>
                          {c.negotiation_point}
                        </div>
                      )}
                      {report.comparative_scores?.[c.clause_id]?.verdict && (
                        <div style={{ marginTop: 6, fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--medium)' }}>
                          BENCHMARK — {report.comparative_scores[c.clause_id].verdict}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
          )}

          {/* Tab: Contradictions */}
          {activeTab === 'contra' && (
            (!report.contradictions?.length)
              ? <div className="empty-row"><div className="empty-check">✓</div>No contradictions detected between clauses.</div>
              : <div className="contra-table">
                  {report.contradictions.map((c, i) => (
                    <div key={i} className="contra-row">
                      <div className="contra-header">
                        <RiskTag level={c.severity} />
                        <span className="contra-type">{c.contradiction_type}</span>
                      </div>
                      <div className="contra-desc">{c.description}</div>
                      <div className="contra-pair">
                        <div className="contra-clause-block">
                          <div className="contra-clause-ref">CLAUSE {c.clause_a_id}</div>
                          <div className="contra-clause-text">{c.clause_a_text}</div>
                        </div>
                        <div className="contra-clause-block">
                          <div className="contra-clause-ref">CLAUSE {c.clause_b_id}</div>
                          <div className="contra-clause-text">{c.clause_b_text}</div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
          )}

          {/* Tab: Missing */}
          {activeTab === 'missing' && (
            (!report.missing_clauses?.length)
              ? <div className="empty-row"><div className="empty-check">✓</div>All standard protective clauses are present.</div>
              : <div className="missing-table">
                  {report.missing_clauses.map((m, i) => (
                    <div key={i} className="missing-row">
                      <span className="missing-index">{String(i + 1).padStart(2, '0')}.</span>
                      <span>{m}</span>
                    </div>
                  ))}
                </div>
          )}

          {/* Tab: Summary */}
          {activeTab === 'summary' && (
            <div className="summary-block">
              <div className="summary-text">{report.plain_english_summary || 'Summary not available.'}</div>
            </div>
          )}

          {/* Footer */}
          <div className="report-footer">
            <div>
              <div className="footer-meta">CONTRACT ID — {report.contract_id}</div>
              <div className="footer-meta" style={{ marginTop: 4 }}>
                GENERATED — {new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'long', year: 'numeric' }).toUpperCase()}
              </div>
            </div>
            <div className="footer-actions">
              <button className="btn-secondary" onClick={handleExportCSV}>↓ Export CSV</button>
              <button className="btn-secondary" onClick={handleExportJSON}>↓ Export JSON</button>
              <button className="btn-secondary" onClick={() => window.print()}>⎙ Print Report</button>
            </div>
          </div>

        </>)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
